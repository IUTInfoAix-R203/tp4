# GitHub Classroom autograding workflow.
# Le bloc autograding (steps Classroom + reporter) est régénéré par
# update-autograding.sh en fonction des sous-paquets d'exercices
# détectés. Ne pas éditer à la main le bloc entre marqueurs.
name: GitHub Classroom Workflow

on: [push]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Autograding
    if: github.repository != 'IUTInfoAix-R203/template-tp-java'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      #@@@AUTOGRADING-BEGIN@@@ (bloc auto-généré par l'outillage enseignant, ne pas éditer à la main)
      - name: Compilation
        id: compilation
        uses: IUTInfoAix-R202/autograding-command-grader@main
        with:
          test-name: Compilation
          setup-command: ""
          command: ./mvnw -B -q compile
          timeout: 5
          max-score: 100

      - name: "exercice1 : factureVide_totalEstZero"
        id: exercice1_factureVide_totalEstZero
        uses: IUTInfoAix-R202/autograding-command-grader@main
        with:
          test-name: "exercice1 : factureVide_totalEstZero"
          setup-command: ""
          command: ./grade-test.sh fr.univ_amu.iut.exercice1.FactureTest factureVide_totalEstZero
          timeout: 5
          max-score: 3

      - name: "exercice1 : unSeulArticleSousLeSeuil_applique_TVA_sans_remise"
